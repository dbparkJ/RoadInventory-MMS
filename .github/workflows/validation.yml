name: Validation

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python CPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install locked CPU runtime and test tools
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then
            venv_python=.venv/Scripts/python.exe
          else
            venv_python=.venv/bin/python
          fi
          echo "VENV_PYTHON=$venv_python" >> "$GITHUB_ENV"
          "$venv_python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1+cpu torchvision==0.22.1+cpu torchaudio==2.7.1+cpu
          "$venv_python" -m pip install -r requirements.txt -r requirements-dev.txt
          "$venv_python" -m pip check
      - name: CPU environment smoke
        run: '"$VENV_PYTHON" scripts/verify_environment.py --expected-torch-runtime cpu --allow-cpu'
      - name: Python unit and contract tests
        run: '"$VENV_PYTHON" -m pytest -q --junitxml=test-results/python.xml'
      - name: Verify pytest failure propagation
        run: '"$VENV_PYTHON" scripts/check_ci_failure_propagation.py --python-only'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-${{ matrix.os }}
          path: test-results/*.xml
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked frontend and test tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm --prefix webui ci --no-audit --no-fund
      - name: TypeScript check
        working-directory: webui
        run: node node_modules/typescript/bin/tsc -b
      - name: Frontend tests
        run: npm --prefix webui test -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit=../test-results/frontend.xml
      - name: Production build
        run: npm --prefix webui run build
      - name: Verify CI tool failures propagate
        run: python scripts/check_ci_failure_propagation.py
      - name: Package same-checkout source and verified UI
        run: python scripts/package_release.py --output .cache/release/roadinventory-mms.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-tests-${{ matrix.os }}
          path: test-results/*.xml
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-ui-package-${{ matrix.os }}
          path: .cache/release/*.zip
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
