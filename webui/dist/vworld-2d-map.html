<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VWorld 2D 일반지도</title>
    <style>
      html,
      body,
      #vmap {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #eef2f5;
      }
    </style>
    <script>
      // VWorld's 2D bootstrap still loads its dependencies synchronously with
      // document.write, so it lives in this isolated same-origin frame.
      ;(() => {
        const mmsVworldDevelopmentKey = 'EE4D1CA9-BEA1-3AFF-AE81-DE0B92A0E352'
        const domain = encodeURIComponent(window.location.origin)
        document.write(
          '<script src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0' +
            '&apiKey=' +
            encodeURIComponent(mmsVworldDevelopmentKey) +
            '&domain=' +
            domain +
            '"><\/script>',
        )
      })()
    </script>
  </head>
  <body>
    <div id="vmap"></div>
  </body>
</html>
